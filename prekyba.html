<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Šviežios ūkio produkcijos užsakymas – jautiena ir pieno produktai</title>

<!-- Favicons -->
<link rel="icon" type="image/png" href="./img/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="./img/favicon/favicon.svg" />
<link rel="shortcut icon" href="./img/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="./img/favicon/apple-touch-icon.png" />
<link rel="manifest" href="./img/favicon/site.webmanifest" />

<meta name="theme-color" content="#0a1f18" />

<!-- Open Graph Meta Tags -->
<meta property="og:url" content="https://pasjurkus.lt/prekyba.html">
<meta property="og:site_name" content="Pas Jurkus">
<meta property="og:type" content="website">
<meta property="og:title" content="Šviežios ūkio produkcijos užsakymas 🥩 🧀">
<meta property="og:description" content="Užsisakykite šviežią jautieną ir pieno produktus tiesiai iš Jurkų šeimos ūkio. Natūrali, vietinė produkcija.">
<meta property="og:image" content="https://pasjurkus.lt/img/og-image.png">
  
<!-- Google Fonts & Font Awesome -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Tagesschrift&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/11da5eb453.js" crossorigin="anonymous"></script>

<style>
:root {
  /* Deep Luxury Emerald & Forest Palette */
  --emerald-darkest: #061510;
  --emerald-dark: #0a1f18;
  --emerald-main: #133227;
  --emerald-light: #1d4738;

  /* Champagne & Soft Metallic Gold Accents */
  --gold-primary: #d4af37;
  --gold-light: #e6ca65;
  --gold-gradient: linear-gradient(135deg, #dfba4f 0%, #c59b27 100%);
  --gold-glow: rgba(212, 175, 55, 0.35);

  /* Clean Modern Dark Neutrals */
  --bg-main: #071712;
  --bg-card: #0f271f;
  
  --text-bright: #ffffff;
  --text-body: #e1e9e5;
  --text-muted: #9bb3a8;
  
  --border-subtle: rgba(212, 175, 55, 0.18);
  --border-active: rgba(212, 175, 55, 0.45);
  --shadow-luxury: 0 15px 35px rgba(0, 0, 0, 0.4);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  margin: 0; 
  padding: 0;
  background-color: var(--bg-main);
  color: var(--text-body);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

header {
  text-align: center;
  padding: 2rem 1rem 1rem;
  background: radial-gradient(circle at top, rgba(19, 50, 39, 0.4) 0%, rgba(7, 23, 18, 1) 100%);
  border-bottom: 1px solid var(--border-subtle);
}

header img { 
  width: 240px; 
  max-width: 100%;
  filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3)) 
          drop-shadow(0 4px 15px rgba(0, 0, 0, 0.8))
          brightness(1.15);
  transition: transform 0.3s ease;
}

header img:hover {
  transform: scale(1.02);
}

h1 { 
  font-family: "Tagesschrift", 'Plus Jakarta Sans', sans-serif; 
  margin: 0.5rem 0 0.1rem; 
  font-size: 2rem;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF3B0 40%, #E6CA65 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #E6CA65;
  filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.8));
}

.subtitle { 
  font-size: 1rem; 
  color: var(--text-muted);
  margin: 0;
  font-weight: 400;
}

h3 { 
  text-align: left; 
  margin: 2rem 0 1rem; 
  font-size: 1.35rem; 
  padding-bottom: 0.4rem; 
  font-family: "Tagesschrift", 'Plus Jakarta Sans', sans-serif; 
  color: var(--gold-primary);
  border-bottom: 1px solid var(--border-subtle);
  letter-spacing: 0.5px;
}

main { 
  flex: 1; 
  padding: 0 1rem 6rem; 
  width: 100%; 
  max-width: 650px; 
  margin: 0 auto; 
}

/* Product Card */
.product {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: 1.1rem;
  margin-bottom: 0.8rem;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  transition: border-color 0.3s ease;
}

.product:hover {
  border-color: var(--border-active);
}

.product-header-full {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  width: 100%;
  gap: 0.8rem;
}

.product-name { 
  font-weight: 600; 
  font-size: 1.05rem;
  color: var(--text-bright);
}

.product-price {
  font-weight: 700;
  color: var(--gold-light);
  font-size: 0.98rem;
  white-space: nowrap;
}

.product-body {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 1rem;
  width: 100%;
  margin-top: 0.2rem;
}

.product-info {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  flex: 1;
}

.product-desc { 
  color: var(--text-body); 
  font-size: 0.88rem;
  line-height: 1.4;
}

.product-use { 
  display: block; 
  color: var(--text-muted); 
  font-size: 0.82rem;
  font-style: italic; 
  line-height: 1.3;
}

.product-price-qty {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.35rem;
}

.product-balance {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.product-balance strong {
  color: var(--gold-primary);
}

/* Qty Container */
.qty-container {
  display: flex;
  align-items: center;
  border: 1px solid var(--border-active);
  border-radius: 10px;
  overflow: hidden;
  width: fit-content;
  background-color: var(--emerald-darkest);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}

.qty-container button {
  width: 36px;
  height: 36px;
  border: none;
  background-color: var(--emerald-main);
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
  color: var(--gold-primary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.qty-container button:hover { 
  background-color: var(--emerald-light); 
  color: var(--text-bright);
}

.qty-container button:active { 
  background-color: var(--gold-primary); 
  color: var(--emerald-darkest);
}

.qty-container input[type="number"] {
  width: 44px;
  text-align: center;
  border: none;
  background: transparent;
  color: var(--text-bright);
  font-size: 16px;
  font-weight: 600;
  outline: none;
  -moz-appearance: textfield;
}

.qty-container input::-webkit-outer-spin-button,
.qty-container input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Sticky Footer Button */
footer {
  background: linear-gradient(180deg, rgba(7, 23, 18, 0) 0%, rgba(6, 21, 16, 0.95) 40%, rgba(6, 21, 16, 1) 100%);
  text-align: center;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 1rem;
  z-index: 100;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

footer button {
  color: var(--emerald-darkest);
  background: var(--gold-gradient);
  border: none;
  cursor: pointer;
  padding: 0.85rem 2rem;
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: 12px;
  box-shadow: 0 4px 20px var(--gold-glow);
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  width: 100%;
  max-width: 400px;
}

footer button:active { 
  transform: translateY(1px);
  box-shadow: 0 2px 10px var(--gold-glow);
}

@media (hover: hover) {
  footer button:hover { 
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
  }
}

.loader {
  width: 36px; 
  height: 36px;
  border: 3px solid rgba(212, 175, 55, 0.2);
  border-top-color: var(--gold-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 3rem auto;
}

@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<body>
<header>
  <a href="./">
    <img src="./img/logo.png" alt="Jurkų Šeimos Ūkis">
  </a>
  <h1>Jurkų Šeimos Ūkis</h1>
  <p class="subtitle">Šviežios produkcijos užsakymas</p>
</header>

<main>
  <div id="products">
    <div class="loader" id="loader"></div>
  </div>
</main>

<footer>
  <button id="btnOrder">
    Užsakyti <i class="fa-brands fa-whatsapp"></i>
  </button>
</footer>

<script>
function checkSection(section) {
  if (!section.querySelector('.product')) {
    section.innerHTML += `<p style="color: var(--text-muted); font-style: italic; padding: 0.5rem 0;">Šiuo metu neturime.</p>`;
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  const container = document.getElementById('products');
  const loader = document.getElementById('loader');

  let products = [];

  try {
    const response = await fetch(`produkcija.json?v=${new Date().getTime()}`);
    if (!response.ok) throw new Error("Failas nerastas");
    products = await response.json();
  } catch (e) {
    loader.textContent = "Nepavyko užkrauti duomenų iš failo.";
    console.error(e);
    return;
  }

  const beefSection = document.createElement('div');
  const cheeseSection = document.createElement('div');
  const otherSection = document.createElement('div');

  beefSection.innerHTML = `<h3>Šviežia jautiena</h3>`;
  cheeseSection.innerHTML = `<h3>Sūriai</h3>`;
  otherSection.innerHTML = `<h3>Kiti produktai</h3>`;

  products.forEach(p => {
    const balance = Math.max(0, Number(p.Balance) || 0);

    const row = document.createElement('div');
    row.className = 'product';
      
    row.innerHTML = `
      <div class="product-header-full">
        <div class="product-name">${p.Name}</div>
        ${p.Price ? `<div class="product-price">${p.Price} EUR/${p.Unit}</div>` : ''}
      </div>
  
      <div class="product-body">
        <div class="product-info">
          ${p.Description ? `<small class="product-desc">${p.Description}</small>` : ''}
          ${p.Use ? `<small class="product-use">${p.Use}</small>` : ''}
        </div>
  
        <div class="product-price-qty">
          <div class="qty-container" data-sku="${p.SKU}">
            <button type="button" class="decrease">-</button>
            <input type="number" min="0" max="${balance}" value="0" inputmode="numeric" pattern="[0-9]*" />
            <button type="button" class="increase">+</button>
          </div>
  
          <small class="product-balance">Likutis: <strong>${balance}</strong></small>
        </div>
      </div>
    `;

    if (p.SKU.startsWith('J')) beefSection.appendChild(row);
    else if (p.SKU.startsWith('S')) cheeseSection.appendChild(row);
    else if (p.SKU.startsWith('O')) otherSection.appendChild(row);
  });

  loader.remove();
  container.appendChild(beefSection);
  container.appendChild(cheeseSection);
  container.appendChild(otherSection);

  checkSection(beefSection);
  checkSection(cheeseSection);
  checkSection(otherSection);

  document.querySelectorAll('.qty-container').forEach(container => {
    const input = container.querySelector('input');
    const max = Number(input.max);

    container.querySelector('.increase').addEventListener('click', () => {
      let val = Number(input.value);
      if (val < max) input.value = val + 1;
    });

    container.querySelector('.decrease').addEventListener('click', () => {
      let val = Number(input.value);
      if (val > 0) input.value = val - 1;
    });
  });

  document.getElementById('btnOrder').addEventListener('click', () => {
    const selected = products.map(p => {
      const container = document.querySelector(`.qty-container[data-sku="${p.SKU}"]`);
      const input = container ? container.querySelector('input') : null;
      const v = input ? Number(input.value) : 0;
      return v > 0 ? { sku: p.SKU, text: `${p.Name}: ${v}` } : null;
    }).filter(Boolean);

    if (!selected.length) {
      alert('Pasirinkite bent vieną produktą.');
      return;
    }

    const beef = selected.filter(i => i.sku.startsWith('J')).map(i => `* ${i.text}`).join('\n');
    const cheese = selected.filter(i => i.sku.startsWith('S')).map(i => `* ${i.text}`).join('\n');
    const other = selected.filter(i => i.sku.startsWith('O')).map(i => `* ${i.text}`).join('\n');

    let msg = `Užsakymas ${generateOrderId()}\n`;
    if (beef) msg += `*Jautiena*\n${beef}\n`;
    if (cheese) msg += `*Sūriai*\n${cheese}\n`;
    if (other) msg += `*Kiti produktai*\n${other}\n`;
    msg += `Suprantu, kad užsakomus kiekius dar turės patvirtinti ūkis.`;

    window.location.href = 'https://wa.me/37062804118?text=' + encodeURIComponent(msg);
  });
});

function generateOrderId() {
  const d = new Date();
  return (
    '#' +
    (d.getFullYear() % 100).toString(36).toUpperCase() +
    (d.getMonth() + 1).toString(36).toUpperCase() +
    d.getDate().toString(36).toUpperCase() +
    d.getHours().toString().padStart(2, '0') +
    d.getMinutes().toString().padStart(2, '0')
  );
}
</script>
</body>
</html>
